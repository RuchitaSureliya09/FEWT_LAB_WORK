<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 3. Write a JavaScript having a list of checkbox and by clicking on checkbox, it should show list of
         selected value in comma separated format. (e.g. list of roll number as checkbox value, and display
         selected roll number in comma separated format) (C) -->
    <div id="head" class="container align-justify-center mt-5 fs-5">
      <h2>Select Roll Numbers</h2>
      <br>
      <input type="checkbox" value="101" onchange="change()" /> 101 Student<br />
      <input type="checkbox" value="102" onchange="change()" /> 102 Student<br />
      <input type="checkbox" value="103" onchange="change()" /> 103 Student<br />
      <input type="checkbox" value="104" onchange="change()" /> 104 Student<br />
      <input type="checkbox" value="105" onchange="change()" /> 105 Student<br />
      <br />
  
      <b>Selected Roll Numbers:</b><br>
      <div class="row">
        <textarea id="result" class="form-control col-md-6"></textarea>
      </div>
    </div>

    <script>
      function change() {
        let checkboxes = document.querySelectorAll(
          'input[type="checkbox"]:checked',
        );
        let selected = [];

        checkboxes.forEach((checkbox)=> {
          selected.push(checkbox.value);
        });

        document.getElementById("result").innerHTML = selected.join(", ");
      }
    </script>
  </body>
</html>
