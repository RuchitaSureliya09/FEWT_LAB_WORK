    <title>Student Attendance System</title>
    <link rel="stylesheet" href="A1.css" />

      <div class="row justify-content-center">
        <div class="col-xl-8 col-lg-11">
          <div class="card shadow-lg p-4">
            <h1 class="text-center mb-5">Student Attendance System</h1>

            <div class="text-end mb-3">
              <button class="btn btn-success me-2 fw-bold" onclick="checkAll()">
                ✓ All Present
              </button>

              <button class="btn btn-danger fw-bold" onclick="uncheckAll()">
                ⨉ All Absent
              </button>
            </div>

            <div class="mb-3">
              <label class="fw-bold mb-2" id="listTitle">
                Present Roll Numbers
              </label>

              <textarea
                id="absentList"
                class="form-control"
                placeholder="Enter roll numbers..."
              ></textarea>

              <div class="text-end mt-2">
                <button
                  class="btn btn-warning fw-bold"
                  onclick="applyRollNumbers()"
                >
                  Apply
                </button>
              </div>
            </div>

            <div class="table-container scrollable-table">
              <table class="table table-bordered table-hover text-center">
                <thead class="table-dark">
                  <tr>
                    <th width="15%">Present/Absent</th>
                    <th width="15%">Roll No</th>
                    <th width="70%">Student Name</th>
                  </tr>
                </thead>

                <tbody id="studentTable"></tbody>
              </table>
            </div>

            <div class="text-center mt-4">
              <button class="btn btn-primary me-2" onclick="submitAttendance()">
                Submit Attendance
              </button>

              <button class="btn btn-secondary" onclick="resetAttendance()">
                Reset
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

      //=============== Display Students =================//

      let temp = "";

      for (let i = 0; i < students.length; i++) {
        temp += `
  
          <tr>
      
          <td>
      
          <input
          type="checkbox"
          class="attendance"
          onchange="updateList()">
      
          </td>
      
          <td>${i + 101}</td>
      
          <td class="text-start">${students[i]}</td>
      
          </tr>
      
          `;
      }
      document.getElementById("studentTable").innerHTML = temp;

      let mode = "present";

      document.getElementById("listTitle").innerHTML = "Present Roll Numbers";
      document.getElementById("absentList").value = "";

      //================ Check All =================//

      function checkAll() {
        mode = "absent";

        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          boxes[i].checked = true;
        }

        document.getElementById("listTitle").innerHTML = "Absent Roll Numbers";

        updateList();
      }

      //================ Uncheck All =================//

      function uncheckAll() {
        mode = "present";

        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          boxes[i].checked = false;
        }

        document.getElementById("listTitle").innerHTML = "Present Roll Numbers";

        updateList();
      }

      //================ Update Absent List =================//

      function updateList() {
        let list = [];

        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          if (mode == "present") {
            if (boxes[i].checked) {
              list.push(i + 101);
            }
          } else {
            if (!boxes[i].checked) {
              list.push(i + 101);
            }
          }
        }

        document.getElementById("absentList").value = list.join(" ");
      }

      //================ Submit =================//

      function submitAttendance() {
        let present = 0;
        let absent = 0;

        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          if (boxes[i].checked) present++;
          else absent++;
        }

        alert(
          "Attendance Submitted\n\n" +
            "Total Students : " +
            students.length +
            "\nPresent : " +
            present +
            "\nAbsent : " +
            absent,
        );

        resetAttendance();
      }

      //================ Reset =================//

      function resetAttendance() {
        // Sare checkbox unchecked
        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          boxes[i].checked = false;
        }

        // Present mode on
        mode = "present";

        // Heading change kare ke liye
        document.getElementById("listTitle").innerHTML = "Present Roll Numbers";

        // Textarea clear
        document.getElementById("absentList").value = "";
      }

      //============ Apply Roll Number =================//

      function applyRollNumbers() {
        // Space ya comma dono support karega
        let input = document.getElementById("absentList").value;

        var arr = input.split(/[\s,]+/);
        var numbers = [];

        for (var i = 0; i < arr.length; i++) {
          var n = parseInt(arr[i]);

          if (!isNaN(n)) {
            numbers.push(n);
          }
        }

        // Sab pehle check
        var boxes = document.querySelectorAll(".attendance");

        for (var i = 0; i < boxes.length; i++) {
          boxes[i].checked = false;
        }

        if (mode == "present") {
          // Present mode me likhe hue roll numbers CHECK honge
          for (var i = 0; i < numbers.length; i++) {
            var num = numbers[i];

            if (num >= 101 && num <= students.length + 100) {
              boxes[num - 101].checked = true;
            } else {
              alert("Please Check Roll number ! It's outoff range.");
            }
          }
        } else {
          // Absent mode me sab CHECK
          for (var i = 0; i < boxes.length; i++) {
            boxes[i].checked = true;
          }
          // Jo numbers likhe hain unko UNCHECK
          for (var i = 0; i < numbers.length; i++) {
            var num = numbers[i];

            if (num >= 101 && num <= students.length + 100) {
              boxes[num - 101].checked = false;
            } else {
              alert("Please Check Roll number ! It's outoff range.");
            }
          }
        }
      }
