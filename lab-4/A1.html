<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab-2a</title>
  </head>
  <body>
    <script>
      // 1. WAP in JavaScript to print the factors of given number. (A)

      let n = parseInt(prompt("Enter number : "));

      for (let i = 1; i <= n; i++) {
        if (n % i == 0) document.write(i + "<br/>");
      }
    </script>
  </body>
</html>
