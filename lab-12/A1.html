<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 1. write a jQuery to fade object when clicked on it. (A)-->

    <div class="m-5">
      <h1 id="myh1">Hello Guys!</h1>
      <h1 class="myh1">I am Ruchita</h1>
      <button id="btn1" class="btn btn-primary mt-5 me-2">Fade out</button>
      <button id="btn2" class="btn btn-primary mt-5 me-2">Fade in</button>
      <button id="btn3" class="btn btn-warning mt-5 me-2">Fade toggle</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <script>
      $("#btn1").click(() => {
        $("#myh1").fadeOut();
      });

      $("#btn2").click(() => {
        $("#myh1").fadeIn();
      });

      $("#btn3").click(() => {
        $(".myh1").fadeToggle();
      });
    </script>
  </body>
</html>
