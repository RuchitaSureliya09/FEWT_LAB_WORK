<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A4</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 4. write a jQUery program to get content of textbox and set to paragraph with "data" class. (B) -->

    <div class="m-5">
      <input type="text" id="mytext" />
      <br /><br />

      <p class="data"></p>
      <button id="btn1" class="btn btn-primary mt-5 me-2">Click</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <script>
      $("#btn1").click(() => {
        $(".data").text($("#mytext").val());
        $("#mytext").val(""); // after add value of textbox in paragraph tag textbox firse blank ho jayega
      });
    </script>
  </body>
</html>
