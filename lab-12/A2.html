<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 2. write a jQuery to slideup, slidedown and slidetoggle image. (A) -->

    <div class="m-5">
      <img
        src="background.png"
        alt="Image not found!"
        height="300px"
        width="600px"
        id="img1"
      />
      <img
        src="m8.jpg"
        alt="Image not found!"
        height="300px"
        width="600px"
        class="img2 ms-5"
      /><br /><br />
      <button id="btn1" class="btn btn-info mt-3 me-3">Slide up</button>
      <button id="btn2" class="btn btn-info mt-3 me-3">Slide down</button>
      <button id="btn3" class="btn btn-success mt-3 me-3">Slide toggle</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <script>
      $("#btn1").click(() => {
        $("#img1").slideUp();
      });

      $("#btn2").click(() => {
        $("#img1").slideDown();
      });

      $("#btn3").click(() => {
        $(".img2").slideToggle();
      });
    </script>
  </body>
</html>
