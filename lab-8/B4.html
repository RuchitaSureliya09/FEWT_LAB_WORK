<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B4</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- 4. WAP to recognize which form event is ƒired. (B) -->

    <div class="row m-5">
      <h2>Form Event Recognition</h2>
      <div class="col-6 my-3">
        <form id="myForm">
          Name:
          <input
            type="text"
            id="name"
            class="form-control mt-2"
            placeholder="Enter your name"
          />
          <br />

          Email:
          <input
            type="email"
            id="email"
            class="form-control mt-2"
            placeholder="Enter your email"
          />
          

          <div class="row mt-5">
            <div class="col-3">
              <input type="submit" class="form-control" value="Submit" />
            </div>
            <div class="col-3">
              <input type="reset" class="form-control mb-5" value="Reset" />
            </div>
          </div>
        </form>
      </div>

      <p id="result"></p>
    </div>

    <script>
      let form = document.getElementById("myForm");
      let result = document.getElementById("result");

      form.addEventListener("focusin", () => {
        result.innerHTML = "Form Event Fired: <b>focusin</b>";
      });

      form.addEventListener("focusout", () => {
        result.innerHTML = "Form Event Fired: <b>focusout</b>";
      });

      form.addEventListener("change", () => {
        result.innerHTML = "Form Event Fired: <b>change</b>";
      });

      form.addEventListener("submit", (e) => {
        event.preventDefault();
        result.innerHTML = "Form Event Fired: <b>submit</b>";
      });

      form.addEventListener("reset", () => {
        result.innerHTML = "Form Event Fired: <b>reset</b>";
      });
    </script>
  </body>
</html>
