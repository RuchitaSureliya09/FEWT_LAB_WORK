<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B9</title>
  </head>
  <body>
    <!-- 9. Write a JavaScript that handles following mouse events. Add necessary elements. (B)
            JavaScript gives the key code for the key pressed.
            If the key pressed is “a”,”e”,”i”,”o”,”u”, the script should announce that vowel is pressed.
            When the key is released background should change to blue. -->

    <h1>Keyboard Event Handling</h1>
    <h3 id="result">Press any key...</h3>

    <script>
      document.addEventListener("keydown", (e) => {
        let key = event.key.toLowerCase();

        document.getElementById("result").innerHTML =
          "Key Code: " + event.keyCode;

        if ("aeiou".includes(key)) {
          document.getElementById("result").innerHTML += "<br>Vowel is pressed";
          document.body.style.backgroundColor = "blue";
        } else {
          document.body.style.backgroundColor = "white";
        }
      });

      document.addEventListener("keyup", (e) => {
        if ("aeiou".includes(event.key.toLowerCase())) {
          document.body.style.backgroundColor = "blue";
        }
      });
    </script>
  </body>
</html>
