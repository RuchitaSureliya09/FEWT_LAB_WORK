<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C3</title>

    <style>
      button {
        height: 80px;
        width: 80px;
        border-radius: 15px;
        background-color: rgb(94, 93, 93);
        color: white;
        font-size: xx-large;
        border: black 3px solid;
        font-weight: bold;
      }
      #mytxt {
        width: 440px;
        height: 90px;
        margin-bottom: 10px;
        font-size: 1cm;
        font-weight: bold;
        border-radius: 10px;
        text-align: right;
        border: black 4px solid;
      }
      table {
        margin-top: 50px;
        margin-bottom: 50px;
      }
      #d {
        background-color: rgb(193, 86, 86);
      }
      #e {
        background-color: black;
      }
    </style>
  </head>
  <body>
    <!-- 3. WAP to create a scientiƒic graphical calculator using HTML and JavaScript. (C) -->

    <table align="center">
      <tr>
        <td colspan="5">
          <input type="text" id="mytxt" readonly />
        </td>
      </tr>

      <tr>
        <td><button onclick="clearall()" id="e">AC</button></td>
        <td><button onclick="dlt()" id="e">⌫</button></td>
        <td><button onclick="display('(')" id="d">(</button></td>
        <td><button onclick="display(')')" id="d">)</button></td>
        <td><button onclick="scientific('pi')" id="d">π</button></td>
      </tr>

      <tr>
        <td><button onclick="scientific('sin')" id="d">sin</button></td>
        <td><button onclick="scientific('cos')" id="d">cos</button></td>
        <td><button onclick="scientific('tan')" id="d">tan</button></td>
        <td><button onclick="scientific('log')" id="d">log</button></td>
        <td><button onclick="scientific('ln')" id="d">ln</button></td>
      </tr>

      <tr>
        <td><button onclick="scientific('sqrt')" id="d">√</button></td>
        <td><button onclick="scientific('square')" id="d">x²</button></td>
        <td><button onclick="scientific('cube')" id="d">x³</button></td>
        <td><button onclick="scientific('reciprocal')" id="d">1/x</button></td>
        <td><button onclick="scientific('factorial')" id="d">n!</button></td>
      </tr>

      <tr>
        <td><button onclick="display('7')">7</button></td>
        <td><button onclick="display('8')">8</button></td>
        <td><button onclick="display('9')">9</button></td>
        <td><button onclick="display('+')" id="d">+</button></td>
        <td><button onclick="scientific('e')" id="d">e</button></td>
    </tr>
    
    <tr>
        <td><button onclick="display('4')">4</button></td>
        <td><button onclick="display('5')">5</button></td>
        <td><button onclick="display('6')">6</button></td>
        <td><button onclick="display('-')" id="d">-</button></td>
        <td><button onclick="display('/')" id="d">/</button></td>
      </tr>

      <tr>
        <td><button onclick="display('1')">1</button></td>
        <td><button onclick="display('2')">2</button></td>
        <td><button onclick="display('3')">3</button></td>
        <td><button onclick="display('*')" id="d">*</button></td>
        <td><button onclick="display('**')" id="d">^</button></td>
      </tr>
      
      <tr>
          <td><button onclick="display('00')">00</button></td>
          <td><button onclick="display('0')">0</button></td>
          <td><button onclick="display('.')">.</button></td>
          <td><button onclick="display('%')" id="d">%</button></td>
        <td><button onclick="result()" id="e">=</button></td>
      </tr>
    </table>
    <script>
      function display(num) {
        document.getElementById("mytxt").value += num;
      }

      function clearall() {
        document.getElementById("mytxt").value = "";
      }

      function dlt() {
        let exp = document.getElementById("mytxt").value;
        document.getElementById("mytxt").value = exp.slice(0, -1);
      }

      function result() {
        let exp = document.getElementById("mytxt").value;

        try {
          document.getElementById("mytxt").value = eval(exp);
        } catch {
          document.getElementById("mytxt").value = "Error";
        }
      }

      function scientific(type) {
        let txt = document.getElementById("mytxt");
        let num = Number(txt.value);
        let ans;

        switch (type) {
          case "sin":
            ans = Math.sin((num * Math.PI) / 180);
            break;

          case "cos":
            ans = Math.cos((num * Math.PI) / 180);
            break;

          case "tan":
            ans = Math.tan((num * Math.PI) / 180);
            break;

          case "sqrt":
            ans = Math.sqrt(num);
            break;

          case "log":
            ans = Math.log10(num);
            break;

          case "ln":
            ans = Math.log(num);
            break;

          case "square":
            ans = num * num;
            break;

          case "cube":
            ans = num * num * num;
            break;

          case "pi":
            txt.value += Math.PI;
            return;

          case "e":
            txt.value += Math.E;
            return;

          case "factorial":
            if (num < 0 || !Number.isInteger(num)) {
              txt.value = "Error";
              return;
            }

            ans = 1;
            for (let i = 1; i <= num; i++) {
              ans *= i;
            }
            break;
        }

        txt.value = ans;
      }
    </script>
  </body>
</html>
