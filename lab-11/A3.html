<body>
    <script>
      // 3. Demonstrate the ‘for of’ loop. (A)

        arr = [1,2,3,4,5]

        console.log("Array :");

        for (const element of arr) {
            console.log(element);
        }

        obj = {
            name : "Ruchita",
            roll_no : 128,
            age : 18
        }

        console.log("Object : ");

        // object ma sometime for of loop work nai kare 
        // tyare object mate for in loop use karvi
        
        for (const element in obj) {
            console.log(element+ " =",obj[element]);
        }
    </script>
