<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1</title>
</head>
<body>
    <script>
        // 1. Find Maximum, Minimum, and Absolute Value using the Math object. (A)
        
        document.write("<h3>"+"values : 12, 14, 86, 29, 50, 34"+"</h3>")
        document.write("Maximum : "+ Math.max(12, 14, 86, 29, 50, 34)+"</br>")
        document.write("Minimum : "+ Math.min(12, 14, 86, 29, 50, 34)+"</br></br>")

        document.write("<h3>Absolute values : </h3>")
        document.write("(-34) : "+Math.abs(-34)+"</br>")
        document.write("(-60) : "+Math.abs(-60)+"</br>")
        document.write("(16) : "+Math.abs(16)+"</br>")

        let A=[10,30,20,60,40]

        document.write("<h3>Array : </h3>")
        document.write(Math.max(A))
    </script>
</body>
</html>
