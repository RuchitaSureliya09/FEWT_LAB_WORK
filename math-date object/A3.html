<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3</title>
</head>
<body>
    <script>
        // 3. Display Floor, Ceiling, Round, and Truncate values of a decimal number. (A)
        
        document.write("<h3>Floor values : (small integer)</h3>")
        document.write("(-34.8) : "+Math.floor(-34.8)+"</br>")
        document.write("(60.5) : "+Math.floor(60.5)+"</br>")
        document.write("(16.3) : "+Math.floor(16.3)+"</br></br>")

        document.write("<h3>Ceiling values : (next integer)</h3>")
        document.write("(-34.8) : "+Math.ceil(-34.8)+"</br>")
        document.write("(-63.5) : "+Math.ceil(-63.5)+"</br>")
        document.write("(16.3) : "+Math.ceil(16.3)+"</br></br>")

        document.write("<h3>Round values : </h3>")
        document.write("(4.8) : "+Math.round(4.8)+"</br>")
        document.write("(-63.5) : "+Math.round(-63.5)+"</br>")
        document.write("(28.3) : "+Math.round(28.3)+"</br></br>")

        document.write("<h3>Truncate values : </h3>")
        document.write("(-34.8) : "+Math.trunc(-34.8)+"</br>")
        document.write("(-6.5) : "+Math.trunc(-6.5)+"</br>")
        document.write("(16.3) : "+Math.trunc(16.3)+"</br>")
    </script>
</body>
</html>
