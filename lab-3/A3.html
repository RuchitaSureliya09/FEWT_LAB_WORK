  <body>
    <script>
      // 3. WAP in JavaScript to ƒnd the factorial of given number. (A)

      let n = parseInt(prompt("Enter number : "));
      let fact = 1;

      for (let i = 1; i <= n; i++) {
        fact *= i;
      }

      document.write("Factorial : " + fact);
    </script>
  </body>
</html>
