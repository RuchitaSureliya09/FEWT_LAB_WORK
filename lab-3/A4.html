    <title>A4</title>

  <body>
    <script>
      // 4. WAP in JavaScript to print the Fibonacci series of a number. (A)

      let n = parseInt(prompt("Enter number : "));
      let a = 0,
        b = 1;

      for (let i = 0; i < n; i++) {
        sum = a + b;
        if (i == 0) {
          console.log(a);
          console.log(b);
        }
        a = b;
        b = sum;

        console.log(sum);
        sum = 0;
      }
    </script>
  </body>
</html>
